
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Voice Assistant</title>

  <link
    rel="stylesheet"
    href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
  />

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
  />

  <link rel="stylesheet" href="../static/style.css" />

  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="../static/script.js"></script>
</head>

<body>

  <div class="app">

    <!-- TOP BAR -->

    <header class="header">

      <div class="logo">
        <div class="logo-mark">
          <span></span>
          <span></span>
          <span></span>
        </div>

        <span class="logo-text">Voice</span>
      </div>

      <div class="header-actions">

        <div class="voice-control">
          <i class="fa fa-sliders"></i>

          <select id="voice-options">
            <option value="">Default Voice</option>
            <option value="en-US_MichaelV3Voice">Michael</option>
            <option value="en-US_HenryV3Voice">Henry</option>
            <option value="en-GB_KateV3Voice">Kate</option>
            <option value="en-GB_JamesV3Voice">James</option>
            <option value="en-GB_CharlotteV3Voice">Charlotte</option>
            <option value="en-US_LisaV3Voice">Lisa</option>
            <option value="en-US_KevinV3Voice">Kevin</option>
            <option value="en-US_EmilyV3Voice">Emily</option>
            <option value="en-US_AllisonV3Voice">Allison</option>
            <option value="en-US_OliviaV3Voice">Olivia</option>
            <option value="fr-CA_LouiseV3Voice">Louise</option>
            <option value="fr-FR_ReneeV3Voice">Renee</option>
            <option value="fr-FR_NicolasV3Voice">Nicolas</option>
            <option value="it-IT_FrancescaV3Voice">Francesca</option>
          </select>
        </div>

        <label class="theme-button">
          <input
            type="checkbox"
            id="light-dark-mode-switch"
          />

          <i class="fa fa-moon-o"></i>
        </label>

      </div>

    </header>


    <!-- MAIN EXPERIENCE -->

    <main class="voice-stage">

      <div class="intro">

        <div class="eyebrow">
          <span class="live-dot"></span>
          Listening
        </div>

        <h1>
          What’s on your mind?
        </h1>

        <p>
          Speak naturally. I’m listening.
        </p>

      </div>


      <!-- AUDIO VISUALIZER -->

      <div class="voice-visualizer">

        <div class="ambient-glow"></div>

        <div class="wave wave-one"></div>
        <div class="wave wave-two"></div>
        <div class="wave wave-three"></div>

        <div class="orb">

          <div class="orb-inner">

            <i
              class="fa fa-microphone"
              id="main-microphone"
            ></i>

          </div>

        </div>


        <!-- WAVE BARS -->

        <div class="wave-bars">

          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>

        </div>

      </div>


      <!-- CHAT -->

      <div
        id="chat-window"
        class="chat-window"
      >

        <div id="message-list"></div>

        <div class="loading-animation my-loading">
          <div class="loading-dots my-loading">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
          </div>
        </div>

        <div class="loading-animation">
          <div class="loading-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
          </div>
        </div>

      </div>


      <!-- INPUT -->

      <div class="input-area">

        <div class="input-pill">

          <input
            type="text"
            id="message-input"
            placeholder="Say something..."
            autocomplete="off"
          />

          <button
            id="send-button"
            class="microphone"
            aria-label="Speak"
          >
            <i class="fa fa-microphone"></i>
          </button>

        </div>

        <div class="input-caption">
          Tap the microphone and start speaking
        </div>

      </div>

    </main>

  </div>

</body>
</html>
